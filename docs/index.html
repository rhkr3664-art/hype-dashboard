<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>익명 투표 앱 서비스 현황</title>
<meta name="description" content="익명 투표 앱의 참여 병목과 아하모먼트 지표 대시보드 (BigQuery mart → data.json)">
<style>
:root {
  color-scheme: light;
  --page: #f4f3f8;
  --surface: #ffffff;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #898781;
  --grid: #e8e7e1;
  --axis: #c3c2b7;
  --border: rgba(11,11,11,0.07);
  --shadow: 0 1px 2px rgba(20,18,50,0.04), 0 6px 20px rgba(20,18,50,0.06);
  --chip: #f0efec;
  /* 섹션 색 (validate_palette.js all-pairs 통과: blue / orange / aqua) */
  --blue: #2a78d6;   --blue-wash: rgba(42,120,214,0.10);  --blue-soft: #e6f0fc;
  --orange: #eb6834; --orange-wash: rgba(235,104,52,0.10); --orange-soft: #fdeee6;
  --aqua: #1baf7a;   --aqua-wash: rgba(27,175,122,0.10);   --aqua-soft: #e3f6ee;
  /* 비교 기간 막대: 이번 기간 = 진한 남보라, 비교 기간 = 회색 */
  --cur: #3a2d9c; --base: #c3c2b7; --prev: #9a9993; /* 이전(비교) 기간 글자: 중간 회색 */
  /* 증감 표시: 오름 = 빨강, 내림 = 파랑, 기준 안 = 회색 (항상 ▲▼ 기호와 함께) */
  --up: #d03b3b; --up-soft: #fbe9e9; --down: #1c5cab; --down-soft: #e3edfb; --flat: #6b6a66; --flat-soft: #f0efec;
  --hero-from: #1b1650; --hero-mid: #3a2d9c; --hero-to: #7a3fb8;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.08); --shadow: none; --chip: #2c2c2a;
    --blue: #3987e5; --blue-wash: rgba(57,135,229,0.16); --blue-soft: rgba(57,135,229,0.16);
    --orange: #d95926; --orange-wash: rgba(217,89,38,0.16); --orange-soft: rgba(217,89,38,0.18);
    --aqua: #199e70; --aqua-wash: rgba(25,158,112,0.16); --aqua-soft: rgba(25,158,112,0.18);
    --cur: #9085e9; --base: #5a5955; --prev: #8f8e88;
    --up: #ef7676; --up-soft: rgba(208,59,59,0.22); --down: #6da7ec; --down-soft: rgba(57,135,229,0.22); --flat: #b0afa8; --flat-soft: #2c2c2a;
    --hero-from: #120f38; --hero-mid: #2a2075; --hero-to: #55308a;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.08); --shadow: none; --chip: #2c2c2a;
  --blue: #3987e5; --blue-wash: rgba(57,135,229,0.16); --blue-soft: rgba(57,135,229,0.16);
  --orange: #d95926; --orange-wash: rgba(217,89,38,0.16); --orange-soft: rgba(217,89,38,0.18);
  --aqua: #199e70; --aqua-wash: rgba(25,158,112,0.16); --aqua-soft: rgba(25,158,112,0.18);
  --cur: #9085e9; --base: #5a5955; --prev: #8f8e88;
  --up: #ef7676; --up-soft: rgba(208,59,59,0.22); --down: #6da7ec; --down-soft: rgba(57,135,229,0.22); --flat: #b0afa8; --flat-soft: #2c2c2a;
  --hero-from: #120f38; --hero-mid: #2a2075; --hero-to: #55308a;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--page); color: var(--ink);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}
.wrap { max-width: 1120px; margin: 0 auto; padding: 0 16px; }
[hidden] { display: none !important; }

/* ---------- header band ---------- */
.band {
  background: radial-gradient(1200px 400px at 85% -10%, rgba(255,140,190,0.35), transparent 60%),
              linear-gradient(120deg, var(--hero-from), var(--hero-mid) 55%, var(--hero-to));
  color: #fff; padding: 28px 0 28px;
}
.brand { display: flex; align-items: center; gap: 10px; }
.logo { width: 34px; height: 34px; border-radius: 10px; background: linear-gradient(135deg, #ff8ac2, #ffb36b);
  display: grid; place-items: center; font-weight: 800; color: #1b1650; font-size: 17px; }
.band h1 { font-size: 22px; margin: 0; font-weight: 700; letter-spacing: -0.01em; }
.meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.meta span { background: rgba(255,255,255,0.12); color: rgba(255,255,255,0.88); border-radius: 999px; padding: 2px 10px; font-size: 12.5px; }

/* 본문 보기 탭 (전체 · 전주 대비 · 전일 대비 · 기간 설정) */
.viewbar { position: sticky; top: 0; z-index: 5; background: var(--page); padding: 14px 0 10px; margin-top: 16px; border-bottom: 1px solid var(--grid); }
.viewbar .seg { margin-bottom: 0; }
.viewbar .seg button { font-size: 14px; padding: 6px 16px; }
.viewbar .period { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-top: 8px; font-size: 13px; color: var(--ink-2); }
.viewbar .period i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.headline .delta { margin-top: 4px; }
.notcmp { font-size: 12px; color: var(--muted); background: var(--chip); border-radius: 6px; padding: 1px 8px; margin-left: 6px; font-weight: 500; }

/* 퍼널 비교: 단계마다 이번 기간(보라) · 비교 기간(회색) 두 줄 */
.fcmp { display: grid; gap: 4px; }
.fcmp .step { display: grid; grid-template-columns: 104px 1fr 72px; gap: 10px; align-items: center; }
.fcmp .bars { display: grid; gap: 3px; }
.fcmp .bars div { height: 10px; border-radius: 0 3px 3px 0; min-width: 2px; }
.fcmp .nums { font-size: 12px; text-align: right; font-variant-numeric: tabular-nums; line-height: 1.25; }
.fcmp .nums span { display: block; color: var(--muted); }
.fcmp .conv { grid-column: 2 / 4; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin: 0 0 4px; }

.kpis { display: grid; grid-template-columns: 1.3fr repeat(3, 1fr); gap: 14px; margin-top: 20px; }
@media (max-width: 860px) { .kpis { grid-template-columns: 1fr 1fr; } .kpis .hero { grid-column: 1 / -1; } }
.kpi { background: rgba(255,255,255,0.10); border: 1px solid rgba(255,255,255,0.16); border-radius: 16px; padding: 16px 18px; }
.kpi .label { font-size: 13px; color: rgba(255,255,255,0.80); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.kpi .value { font-size: 32px; font-weight: 700; margin-top: 6px; line-height: 1.1; letter-spacing: -0.01em; }
.kpi .frac { font-size: 12px; color: rgba(255,255,255,0.62); margin-top: 2px; }
.kpi .pill { font-size: 11px; font-weight: 600; border-radius: 999px; padding: 0 8px; background: rgba(255,255,255,0.18); color: #fff; }
.kpi.hero { background: #fff; color: #0b0b0b; border: 0; }
.kpi.hero .label { color: #52514e; }
.kpi.hero .value { font-size: 56px; color: #1b1650; }
.kpi.hero .frac { color: #898781; }
.kpi.hero .why { font-size: 13px; color: #52514e; margin-top: 10px; }
.kpi .bar { height: 6px; border-radius: 999px; background: rgba(255,255,255,0.18); margin-top: 10px; overflow: hidden; }
.kpi .bar i { display: block; height: 100%; border-radius: 999px; background: #fff; }
.kpi.hero .bar { background: #ece9f8; }
.kpi.hero .bar i { background: #3a2d9c; }
.kpi .wow { margin-top: 8px; font-size: 12px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.kpi .wow .when { color: rgba(255,255,255,0.62); }
.kpi.hero .wow .when { color: #898781; }

/* delta chip */
.delta { display: inline-flex; align-items: center; gap: 3px; font-weight: 700; font-size: 12.5px; border-radius: 6px; padding: 1px 7px; font-variant-numeric: tabular-nums; }
.delta.up { color: var(--up); background: var(--up-soft); }
.delta.down { color: var(--down); background: var(--down-soft); }
.delta.flat { color: var(--flat); background: var(--flat-soft); }
.delta.na { color: var(--muted); background: transparent; font-weight: 500; padding: 0; }
.kpi:not(.hero) .delta.up { color: #fff; background: rgba(239,118,118,0.55); }
.kpi:not(.hero) .delta.down { color: #fff; background: rgba(109,167,236,0.50); }
.kpi:not(.hero) .delta.flat { color: #fff; background: rgba(255,255,255,0.18); }
.kpi:not(.hero) .delta.na { color: rgba(255,255,255,0.62); }

/* ---------- sections ---------- */
section { margin-top: 40px; }
.sec-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.sec-head .tag { font-size: 12px; font-weight: 700; border-radius: 999px; padding: 2px 10px; }
.sec-head h2 { font-size: 19px; margin: 0; font-weight: 700; }
.cond { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 14px; }
.cond span { font-size: 12.5px; color: var(--ink-2); background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 2px 8px; }
.cond b { font-weight: 650; color: var(--ink); margin-right: 4px; }
.t-blue { background: var(--blue-soft); color: var(--ink); }
.t-orange { background: var(--orange-soft); color: var(--ink); }
.t-aqua { background: var(--aqua-soft); color: var(--ink); }
.t-chip { background: var(--chip); color: var(--ink-2); }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 18px 18px 14px; box-shadow: var(--shadow); position: relative; overflow: hidden; }
.card::before { content: ""; position: absolute; left: 0; top: 0; right: 0; height: 3px; background: var(--accent, transparent); }
.c-blue { --accent: var(--blue); } .c-orange { --accent: var(--orange); } .c-aqua { --accent: var(--aqua); } .c-cur { --accent: var(--cur); }
.card-head { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
.card h3 { font-size: 15px; margin: 0; font-weight: 650; }
.card .sub { color: var(--muted); font-size: 12.5px; margin: 2px 0 10px; }
.headline { text-align: right; white-space: nowrap; }
.headline b { display: block; font-size: 24px; font-weight: 700; line-height: 1.1; }
.headline span { font-size: 11.5px; color: var(--muted); }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }
.num { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 6px; font-size: 12px; font-weight: 700; color: #fff; margin-right: 6px; vertical-align: 1px; }
.n-blue { background: var(--blue); } .n-orange { background: var(--orange); } .n-aqua { background: var(--aqua); } .n-gray { background: var(--ink-2); }
.c-gray { --accent: var(--ink-2); }
.grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }

/* charts */
.chart { position: relative; width: 100%; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart text { font-size: 11.5px; fill: var(--muted); font-variant-numeric: tabular-nums; }
.chart .endlabel { fill: var(--ink); font-weight: 650; font-size: 12px; }
.chart .vlabel { fill: var(--ink-2); font-size: 11px; font-weight: 600; paint-order: stroke; stroke: var(--surface); stroke-width: 3px; }
.chart .vlabel-b, .chart .xb { fill: var(--prev); font-weight: 500; }
.chart .hit { fill: transparent; cursor: crosshair; }
.chart .col:hover, .chart .col.on { opacity: 0.8; }
.tip {
  position: fixed; pointer-events: none; z-index: 10; background: var(--surface); color: var(--ink);
  border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; font-size: 12.5px;
  box-shadow: 0 6px 20px rgba(0,0,0,0.14); opacity: 0; transition: opacity .08s; max-width: 260px;
}
.tip .v { font-weight: 700; font-size: 14px; }
.tip .k { color: var(--ink-2); }
.tip .key { display: inline-block; width: 12px; height: 2px; vertical-align: middle; margin-right: 6px; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12.5px; color: var(--ink-2); margin: 4px 0 8px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }

/* funnel */
.funnel { display: grid; gap: 8px; }
.frow { display: grid; grid-template-columns: 104px 1fr 72px; gap: 10px; align-items: center; }
.frow .name { font-size: 13.5px; }
.frow .bar { height: 22px; }
.frow .fill { height: 100%; background: var(--blue); border-radius: 0 4px 4px 0; min-width: 2px; }
.frow .val { font-size: 13px; text-align: right; font-variant-numeric: tabular-nums; }
.frow:hover .fill, .frow:focus .fill { opacity: 0.8; }
.frow:focus { outline: 2px solid var(--blue); outline-offset: 2px; border-radius: 4px; }
.conv { grid-column: 2 / 4; font-size: 12px; color: var(--muted); margin: -4px 0 -2px; }
.conv b { color: var(--ink); }
.conv .worst { background: var(--ink); color: var(--surface); border-radius: 4px; padding: 0 6px; margin-left: 6px; font-weight: 600; }
.seg { display: inline-flex; background: var(--chip); border-radius: 10px; padding: 3px; margin-bottom: 12px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; color: var(--ink-2); padding: 4px 12px; font: inherit; font-size: 13px; cursor: pointer; border-radius: 8px; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 650; box-shadow: 0 1px 2px rgba(0,0,0,0.08); }

/* compare bars (aha) */
.cmp { display: grid; gap: 8px; margin-top: 4px; }
.cmp .row { display: grid; grid-template-columns: 56px 1fr 52px; gap: 10px; align-items: center; font-size: 13px; }
.cmp .track { height: 12px; }
.cmp .fill { height: 100%; background: var(--orange); border-radius: 0 4px 4px 0; }
.cmp .row.dim .fill { background: var(--axis); }
.cmp .v { text-align: right; font-weight: 650; font-variant-numeric: tabular-nums; }
.mini { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
.mini > div { background: var(--aqua-soft); border-radius: 12px; padding: 12px 14px; }
.mini b { display: block; font-size: 22px; font-weight: 700; }
.mini span { font-size: 12.5px; color: var(--ink-2); }

/* ---------- compare view ---------- */
.period { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 28px; }
.period .p { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 8px 12px; font-size: 13.5px; }
.period .p i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.period .vs { color: var(--muted); font-size: 13px; }
.rule { font-size: 12.5px; color: var(--ink-2); margin-top: 10px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.ccards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; margin-top: 16px; }
.ccard { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; box-shadow: var(--shadow); }
.ccard .label { font-size: 13px; color: var(--ink-2); }
.ccard .row { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-top: 6px; }
.ccard .a { font-size: 24px; font-weight: 700; }
.ccard .b { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.ccard .na-note { font-size: 12.5px; color: var(--muted); margin-top: 8px; }
.ranges { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; margin-top: 24px; }
.ranges fieldset { border: 1px solid var(--border); background: var(--surface); border-radius: 12px; padding: 10px 14px 12px; margin: 0; }
.ranges legend { font-size: 13px; font-weight: 650; padding: 0; float: left; width: 100%; margin-bottom: 8px; }  /* float: 제목을 테두리 위가 아니라 박스 안으로 */
.ranges legend + * { clear: both; }
.ranges legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.ranges label { font-size: 12.5px; color: var(--ink-2); margin-right: 6px; }
.ranges input { font: inherit; font-size: 13.5px; padding: 4px 6px; border: 1px solid var(--axis); border-radius: 8px; background: var(--surface); color: var(--ink); }
.ranges .warn { color: var(--up); font-size: 12.5px; margin-top: 6px; }
select.metric { font: inherit; font-size: 13.5px; padding: 4px 8px; border-radius: 8px; border: 1px solid var(--axis); background: var(--surface); color: var(--ink); margin-bottom: 8px; }

details { margin-top: 10px; font-size: 13px; }
summary { color: var(--ink-2); cursor: pointer; }
table { border-collapse: collapse; width: 100%; margin-top: 8px; font-variant-numeric: tabular-nums; }
th, td { text-align: right; padding: 4px 8px; border-bottom: 1px solid var(--grid); }
th:first-child, td:first-child { text-align: left; }
th { color: var(--ink-2); font-weight: 600; }
.tablewrap { overflow-x: auto; }

.guard { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
.guard .card { border: 1px dashed var(--axis); box-shadow: none; background: transparent; }
.guard .state { font-size: 12.5px; color: var(--ink-2); margin-top: 6px; }
footer { margin: 48px 0 40px; color: var(--muted); font-size: 12.5px; }
.err { padding: 24px; border-radius: 12px; background: var(--surface); }
</style>
</head>
<body>
<div class="band">
  <div class="wrap">
    <div class="brand"><div class="logo" aria-hidden="true">?</div><h1>익명 투표 앱 서비스 현황</h1></div>
    <div class="meta" id="meta"></div>
    <div class="kpis" id="kpis"></div>
  </div>
</div>
<div class="wrap">
  <div id="app"><p style="margin-top:24px;color:var(--ink-2)">데이터를 불러오는 중…</p></div>
  <footer>
    데이터: BigQuery <code>mart</code> → <code>data.json</code> (GitHub Actions 매일 갱신, 노트북 결과와 23개 항목 일치 검증 후 반영).
    비율은 날짜별 분자·분모 합으로 계산 (일별 비율의 단순 평균 아님).
  </footer>
</div>
<div class="tip" id="tip" role="status" aria-live="polite"></div>

<script>
(() => {
  // =====================================================================
  // 증감 색 기준 (팀 합의로 바꿀 수 있음)
  //   비율 지표: 비교 기간 대비 ±1.0%p 이상 → 오름 빨강 / 내림 파랑, 그 안쪽은 회색
  //   인원 지표(DAU): 비교 기간 대비 ±5% 이상 → 같은 색 규칙
  // =====================================================================
  const RULE = { ratePP: 1.0, countPct: 5 };

  const $ = (s, el = document) => el.querySelector(s);
  const el = (tag, attrs = {}, ...kids) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (k === 'class') n.className = v; else if (k === 'text') n.textContent = v; else n.setAttribute(k, v);
    }
    kids.flat().forEach(c => c != null && n.append(c));
    return n;
  };
  const SVG = 'http://www.w3.org/2000/svg';
  const s = (tag, attrs = {}) => { const n = document.createElementNS(SVG, tag); for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v); return n; };
  const nf = new Intl.NumberFormat('ko-KR');
  const pct = (v, d = 1) => v == null ? '–' : (v * 100).toFixed(d) + '%';
  const md = iso => { const [, m, d] = iso.split('-'); return `${+m}/${+d}`; };
  const WD = ['일', '월', '화', '수', '목', '금', '토'];
  const toD = iso => new Date(iso + 'T00:00:00Z');
  const toISO = d => d.toISOString().slice(0, 10);
  const addDays = (iso, n) => { const d = toD(iso); d.setUTCDate(d.getUTCDate() + n); return toISO(d); };
  const wd = iso => WD[toD(iso).getUTCDay()];
  const mdw = iso => `${md(iso)}(${wd(iso)})`;
  const rangeText = (a, b) => a === b ? mdw(a) : `${mdw(a)}~${mdw(b)}`;
  const COLOR = { blue: ['var(--blue)', 'var(--blue-wash)'], orange: ['var(--orange)', 'var(--orange-wash)'], aqua: ['var(--aqua)', 'var(--aqua-wash)'], gray: ['var(--ink-2)', 'rgba(128,128,128,0.10)'] };

  // ---------- tooltip ----------
  const tip = $('#tip');
  function showTip(evt, rows, color = 'var(--blue)') {
    tip.replaceChildren(...rows.map(([v, k, key]) => {
      const kk = key ? el('span', { class: 'key' }) : null; if (kk) kk.style.background = key === true ? color : key;
      return el('div', {}, kk, el('span', { class: 'v', text: v }), ' ', el('span', { class: 'k', text: k }));
    }));
    const r = evt.target.getBoundingClientRect();
    const x = evt.clientX ?? r.right, y = evt.clientY ?? r.top;
    tip.style.opacity = 1;
    const w = tip.offsetWidth, h = tip.offsetHeight;
    tip.style.left = Math.min(window.innerWidth - w - 8, x + 14) + 'px';
    tip.style.top = Math.max(8, y - h - 10) + 'px';
  }
  const hideTip = () => { tip.style.opacity = 0; };

  // ---------- line chart (single series, crosshair) ----------
  function niceMax(v) {
    const p = Math.pow(10, Math.floor(Math.log10(v))); const m = v / p;
    return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 4 ? 4 : m <= 8 ? 8 : 10) * p;
  }
  function lineChart(host, pts, { fmt, tipLabel, yMax, extra, color = 'blue' }) {
    const [stroke, wash] = COLOR[color];
    const draw = () => {
      host.replaceChildren();
      if (!host.isConnected || host.clientWidth === 0) return;
      const W = Math.max(280, host.clientWidth), H = 210, m = { l: 40, r: 52, t: 10, b: 26 };
      const iw = W - m.l - m.r, ih = H - m.t - m.b;
      const dataMax = Math.max(...pts.map(p => p.y));
      const max = yMax && yMax >= dataMax ? yMax : niceMax(dataMax * 1.15);
      const X = i => m.l + (pts.length === 1 ? iw / 2 : (i / (pts.length - 1)) * iw);
      const Y = v => m.t + ih - (v / max) * ih;
      const svg = s('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': tipLabel });
      for (let k = 0; k <= 4; k++) {
        const v = (max / 4) * k, y = Y(v);
        svg.append(s('line', { x1: m.l, x2: W - m.r, y1: y, y2: y, stroke: k === 0 ? 'var(--axis)' : 'var(--grid)', 'stroke-width': 1 }));
        const t = s('text', { x: m.l - 8, y: y + 4, 'text-anchor': 'end' }); t.textContent = fmt(v, true); svg.append(t);
      }
      const step = Math.max(1, Math.ceil(pts.length / Math.max(2, Math.floor(iw / 64))));
      const labeled = [];
      pts.forEach((p, i) => {
        if (i % step && i !== pts.length - 1) return;
        labeled.push(i);
        const t = s('text', { x: X(i), y: H - 6, 'text-anchor': 'middle' }); t.textContent = md(p.x); svg.append(t);
      });
      const d = pts.map((p, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)},${Y(p.y).toFixed(1)}`).join('');
      svg.append(s('path', { d: `${d}L${X(pts.length - 1)},${Y(0)}L${X(0)},${Y(0)}Z`, fill: wash }));
      svg.append(s('path', { d, fill: 'none', stroke, 'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }));
      const last = pts.length - 1;
      // x축에 날짜가 적힌 지점에만 값 표시 (마지막 점은 오른쪽 끝 라벨이 있으니 제외)
      labeled.filter(i => i !== last).forEach(i => {
        svg.append(s('circle', { cx: X(i), cy: Y(pts[i].y), r: 3, fill: stroke, stroke: 'var(--surface)', 'stroke-width': 1.5 }));
        const py = Y(pts[i].y), above = py - 8 > m.t + 10;            // 위쪽 끝에 붙으면 점 아래에 표시
        const t = s('text', { x: i === 0 ? X(i) + 4 : X(i), y: above ? py - 8 : py + 16, 'text-anchor': i === 0 ? 'start' : 'middle', class: 'vlabel' });
        t.textContent = fmt(pts[i].y); svg.append(t);
      });
      svg.append(s('circle', { cx: X(last), cy: Y(pts[last].y), r: 4, fill: stroke, stroke: 'var(--surface)', 'stroke-width': 2 }));
      const end = s('text', { x: X(last) + 8, y: Y(pts[last].y) + 4, class: 'endlabel' }); end.textContent = fmt(pts[last].y); svg.append(end);
      const cross = s('line', { y1: m.t, y2: m.t + ih, stroke: 'var(--axis)', 'stroke-width': 1, opacity: 0 });
      const dot = s('circle', { r: 4, fill: stroke, stroke: 'var(--surface)', 'stroke-width': 2, opacity: 0 });
      svg.append(cross, dot);
      const hit = s('rect', { x: m.l, y: m.t, width: iw, height: ih, class: 'hit', tabindex: 0 });
      const at = i => {
        const p = pts[i];
        cross.setAttribute('x1', X(i)); cross.setAttribute('x2', X(i)); cross.setAttribute('opacity', 1);
        dot.setAttribute('cx', X(i)); dot.setAttribute('cy', Y(p.y)); dot.setAttribute('opacity', 1);
        return [[fmt(p.y), tipLabel, true], ...(extra ? extra(p) : []), [mdw(p.x), '']];
      };
      hit.addEventListener('pointermove', e => {
        const r = svg.getBoundingClientRect(); const px = (e.clientX - r.left) * (W / r.width);
        const i = Math.max(0, Math.min(last, Math.round(((px - m.l) / iw) * last)));
        showTip(e, at(i), stroke);
      });
      let ki = last;
      hit.addEventListener('focus', e => showTip(e, at(ki), stroke));
      hit.addEventListener('keydown', e => {
        if (e.key === 'ArrowRight') ki = Math.min(last, ki + 1); else if (e.key === 'ArrowLeft') ki = Math.max(0, ki - 1); else return;
        e.preventDefault(); showTip(e, at(ki), stroke);
      });
      const off = () => { hideTip(); cross.setAttribute('opacity', 0); dot.setAttribute('opacity', 0); };
      hit.addEventListener('pointerleave', off); hit.addEventListener('blur', off);
      svg.append(hit);
      host.append(svg);
    };
    draw();
    new ResizeObserver(() => draw()).observe(host);
  }

  const roundTop = (x, y, w, base) => {
    const h = base - y, rad = Math.min(4, Math.max(0, h));
    return `M${x},${base}V${y + rad}Q${x},${y} ${x + rad},${y}H${x + w - rad}Q${x + w},${y} ${x + w},${y + rad}V${base}Z`;
  };

  // ---------- column chart (aha by signup day) ----------
  function columnChart(host, rows, avg) {
    const draw = () => {
      host.replaceChildren();
      if (host.clientWidth === 0) return;
      const W = Math.max(280, host.clientWidth), H = 220, m = { l: 40, r: 8, t: 12, b: 40 };
      const iw = W - m.l - m.r, ih = H - m.t - m.b;
      const Y = v => m.t + ih - (v / 0.8) * ih;
      const band = iw / rows.length, bw = Math.min(24, band * 0.6);
      const svg = s('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': '가입 날짜별 아하모먼트 도달률' });
      for (let k = 0; k <= 4; k++) {
        const v = k * 0.2, y = Y(v);
        svg.append(s('line', { x1: m.l, x2: W - m.r, y1: y, y2: y, stroke: k === 0 ? 'var(--axis)' : 'var(--grid)', 'stroke-width': 1 }));
        const t = s('text', { x: m.l - 8, y: y + 4, 'text-anchor': 'end' }); t.textContent = Math.round(v * 100) + '%'; svg.append(t);
      }
      rows.forEach((r, i) => {
        const cx = m.l + band * i + band / 2, x = cx - bw / 2;
        const path = s('path', { class: 'col', fill: 'var(--orange)', tabindex: 0, d: roundTop(x, Y(r.aha_rate), bw, Y(0)) });
        const rowsTip = () => [[pct(r.aha_rate), '도달률', true], [`${r.n_aha} / ${r.n_new_users}명`, '도달 / 신규 가입'], [mdw(r.signup_day) + ' 가입', '']];
        const hitR = s('rect', { x: m.l + band * i, y: m.t, width: band, height: ih, fill: 'transparent' });
        const on = e => { path.classList.add('on'); showTip(e, rowsTip(), 'var(--orange)'); };
        const off = () => { path.classList.remove('on'); hideTip(); };
        for (const n of [hitR, path]) { n.addEventListener('pointermove', on); n.addEventListener('pointerleave', off); }
        path.addEventListener('focus', on); path.addEventListener('blur', off);
        svg.append(hitR, path);
        const v = s('text', { x: cx, y: Y(r.aha_rate) - 5, 'text-anchor': 'middle', class: 'vlabel' }); v.textContent = pct(r.aha_rate, 0); svg.append(v);
        const t = s('text', { x: cx, y: H - 22, 'text-anchor': 'middle' }); t.textContent = md(r.signup_day); svg.append(t);
        const n = s('text', { x: cx, y: H - 6, 'text-anchor': 'middle' }); n.textContent = `n=${r.n_new_users}`; svg.append(n);
      });
      const ya = Y(avg);
      svg.append(s('line', { x1: m.l, x2: W - m.r, y1: ya, y2: ya, stroke: 'var(--ink-2)', 'stroke-width': 1 }));
      const at = s('text', { x: W - m.r, y: ya - 6, 'text-anchor': 'end', class: 'endlabel' }); at.textContent = `전체 ${pct(avg)}`; svg.append(at);
      host.append(svg);
    };
    draw();
    new ResizeObserver(() => draw()).observe(host);
  }

  // ---------- grouped columns: 이번 기간 vs 비교 기간, 날짜 순서대로 나란히 ----------
  function pairChart(host, pairs, metric) {
    const draw = () => {
      host.replaceChildren();
      if (host.clientWidth === 0) return;
      const W = Math.max(280, host.clientWidth), H = 230, m = { l: 44, r: 8, t: 12, b: 42 };
      const iw = W - m.l - m.r, ih = H - m.t - m.b;
      const vals = pairs.flatMap(p => [p.a, p.b]).filter(v => v != null);
      if (!vals.length) { host.append(el('p', { class: 'sub', text: '선택한 기간에 이 지표 데이터가 없습니다.' })); return; }
      // 눈금 간격 = 1·2·2.5·5 × 10^k 중 최댓값/4 이상인 가장 작은 값
      const top = Math.max(...vals) * 1.1, raw = top / 4, p10 = Math.pow(10, Math.floor(Math.log10(raw)));
      const step = [1, 2, 2.5, 5, 10].map(k => k * p10).find(v => v >= raw);
      const ticks = Math.max(1, Math.ceil(top / step)), max = ticks * step;
      const Y = v => m.t + ih - (v / max) * ih;
      const band = iw / pairs.length, bw = Math.min(22, (band - 10) / 2);
      const svg = s('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': metric.label + ' 기간 비교' });
      for (let k = 0; k <= ticks; k++) {
        const v = step * k, y = Y(v);
        svg.append(s('line', { x1: m.l, x2: W - m.r, y1: y, y2: y, stroke: k === 0 ? 'var(--axis)' : 'var(--grid)', 'stroke-width': 1 }));
        const t = s('text', { x: m.l - 8, y: y + 4, 'text-anchor': 'end' }); t.textContent = metric.axis(v); svg.append(t);
      }
      const labelEvery = Math.max(1, Math.ceil(pairs.length / Math.max(1, Math.floor(iw / 56))));
      pairs.forEach((p, i) => {
        const cx = m.l + band * i + band / 2;
        const g = [];
        if (p.a != null) g.push(s('path', { class: 'col', fill: 'var(--cur)', d: roundTop(cx - bw - 1, Y(p.a), bw, Y(0)) }));
        if (p.b != null) g.push(s('path', { class: 'col', fill: 'var(--base)', d: roundTop(cx + 1, Y(p.b), bw, Y(0)) }));
        const hitR = s('rect', { x: m.l + band * i, y: m.t, width: band, height: ih, fill: 'transparent', tabindex: 0 });
        const rows = () => {
          const out = [[p.a == null ? '–' : metric.fmt(p.a), p.da ? mdw(p.da) : '이번 기간', 'var(--cur)'],
                       [p.b == null ? '–' : metric.fmt(p.b), p.db ? mdw(p.db) : '비교 기간', 'var(--base)']];
          if (p.a != null && p.b != null) out.push([deltaText(metric, p.a, p.b), '변화']);
          return out;
        };
        const on = e => { g.forEach(n => n.classList.add('on')); showTip(e, rows()); };
        const off = () => { g.forEach(n => n.classList.remove('on')); hideTip(); };
        hitR.addEventListener('pointermove', on); hitR.addEventListener('pointerleave', off);
        hitR.addEventListener('focus', on); hitR.addEventListener('blur', off);
        svg.append(...g, hitR);
        if (i % labelEvery === 0) {
          // 날짜가 적힌 묶음에만 막대 위 값 표시 (이번 기간 · 비교 기간)
          if (p.a != null) { const va = s('text', { x: cx - bw / 2 - 1, y: Y(p.a) - 5, 'text-anchor': 'middle', class: 'vlabel' }); va.textContent = metric.fmt(p.a); svg.append(va); }
          if (p.b != null) { const vb = s('text', { x: cx + bw / 2 + 1, y: Y(p.b) - 5, 'text-anchor': 'middle', class: 'vlabel vlabel-b' }); vb.textContent = metric.fmt(p.b); svg.append(vb); }
          const t1 = s('text', { x: cx, y: H - 24, 'text-anchor': 'middle' }); t1.textContent = p.da ? mdw(p.da) : `${i + 1}일째`; svg.append(t1);
          if (p.db) { const t2 = s('text', { x: cx, y: H - 8, 'text-anchor': 'middle', class: 'xb' }); t2.textContent = 'vs ' + md(p.db); svg.append(t2); }
        }
      });
      host.append(svg);
    };
    draw();
    new ResizeObserver(() => draw()).observe(host);
  }

  function tableView(head, rows) {
    return el('details', {}, el('summary', { text: '표로 보기' }),
      el('div', { class: 'tablewrap' }, el('table', {},
        el('thead', {}, el('tr', {}, head.map(h => el('th', { text: h })))),
        el('tbody', {}, rows.map(r => el('tr', {}, r.map(c => el('td', { text: c }))))))));
  }
  const cond = (...items) => el('div', { class: 'cond' }, items.map(([k, v]) => el('span', {}, el('b', { text: k }), v)));
  const secHead = (tagClass, tagText, title) => el('div', { class: 'sec-head' }, el('span', { class: 'tag ' + tagClass, text: tagText }), el('h2', { text: title }));
  const cardHead = (n, color, title, sub, value, valueLabel) => el('div', { class: 'card-head' },
    el('div', {}, el('h3', {}, n ? el('span', { class: 'num n-' + color, text: n }) : null, title), sub ? el('div', { class: 'sub', text: sub }) : null),
    value ? el('div', { class: 'headline' }, el('b', { text: value }), el('span', { text: valueLabel })) : null);

  // =====================================================================
  // 기간 비교 공통
  // =====================================================================
  let DAILY = [], BYDATE = {}, FIRST = '', LAST = '';
  const METRICS = [
    { key: 'l2c', label: '앱 실행 → 세트 완료율', kind: 'rate', num: 'n_complete', den: 'n_launch' },
    { key: 'l2s', label: '앱 실행 → 투표 시작률', kind: 'rate', num: 'n_start', den: 'n_launch' },
    { key: 's2c', label: '투표 시작 → 세트 완료율', kind: 'rate', num: 'n_complete', den: 'n_start' },
    { key: 'o10', label: '받은 투표 확인 → 10분 내 시작률', kind: 'rate', num: 'n_start_10m', den: 'n_open_users', note: '날짜별 그날 첫 확인 기준' },
    { key: 'rc7', label: '이후 7일 세트 재완료율', kind: 'rate', num: 'n_recomplete_7d', den: 'n_complete_users', note: '완료 후 7일이 지나야 집계' },
    { key: 'd1', label: '다음 날 재방문율 (D1)', kind: 'rate', num: 'd1_return', den: 'd1_base', note: '다음 날 기록이 있어야 집계' },
    { key: 'vdau', label: '방문 DAU (일평균)', kind: 'avg', field: 'visit_dau' },
    { key: 'cdau', label: '완료 DAU (일평균)', kind: 'avg', field: 'complete_dau' },
    // 가드레일
    { key: 'gshare', label: '받은 투표 공유 이용률', kind: 'rate', num: 'n_open_share_days', den: 'n_open_days' },
    // 신고·차단은 아주 드물어서(하루 몇 건) %p 대신 상대 변화 ±50%를 색 기준으로 씀
    { key: 'grpt', label: '질문 신고 사용자 비율', kind: 'rate', num: 'n_report_days', den: 'n_active_days', digits: 3, relRule: 50 },
    { key: 'gblk', label: '차단 사용자 비율', kind: 'rate', num: 'n_block_days', den: 'n_active_days', digits: 3, relRule: 50 },
  ];
  METRICS.forEach(m => {
    m.fmt = m.kind === 'rate' ? v => pct(v, m.digits || 1) : v => nf.format(Math.round(v)) + '명';
    m.axis = m.kind === 'rate' ? v => (m.digits ? (v * 100).toFixed(m.digits) : Math.round(v * 100)) + '%' : v => v >= 1000 ? Math.round(v / 100) / 10 + 'K' : String(Math.round(v));
    m.day = r => m.kind === 'rate' ? (r[m.den] ? r[m.num] / r[m.den] : null) : r[m.field];
  });
  const inRange = (from, to) => DAILY.filter(r => r.date >= from && r.date <= to);
  function agg(m, from, to) {
    const rows = inRange(from, to).filter(r => m.kind === 'rate' ? r[m.den] != null && r[m.num] != null : r[m.field] != null);
    if (!rows.length) return null;
    if (m.kind === 'rate') {
      const n = rows.reduce((t, r) => t + r[m.num], 0), d = rows.reduce((t, r) => t + r[m.den], 0);
      return d ? { v: n / d, n, d, days: rows.length } : null;
    }
    return { v: rows.reduce((t, r) => t + r[m.field], 0) / rows.length, days: rows.length };
  }
  function deltaInfo(m, a, b) {
    if (a == null || b == null) return null;
    if (m.relRule) {
      if (!b) return { cls: a > 0 ? 'up' : 'flat', text: a > 0 ? '0에서 증가' : '0 → 0', sign: Math.sign(a) };
      const r = (a - b) / b * 100;
      return { cls: Math.abs(r) < m.relRule ? 'flat' : r > 0 ? 'up' : 'down', text: `${r > 0 ? '+' : ''}${r.toFixed(0)}%`, sign: Math.sign(r) };
    }
    if (m.kind === 'rate') {
      const pp = (a - b) * 100;
      return { cls: Math.abs(pp) < RULE.ratePP ? 'flat' : pp > 0 ? 'up' : 'down', text: `${pp > 0 ? '+' : ''}${pp.toFixed(1)}%p`, sign: Math.sign(pp) };
    }
    const r = b ? (a - b) / b * 100 : 0;
    return { cls: Math.abs(r) < RULE.countPct ? 'flat' : r > 0 ? 'up' : 'down', text: `${r > 0 ? '+' : ''}${r.toFixed(1)}%`, sign: Math.sign(r) };
  }
  const deltaText = (m, a, b) => { const d = deltaInfo(m, a, b); return d ? d.text : '–'; };
  function chip(info, naText = '비교 불가') {
    if (!info) return el('span', { class: 'delta na', text: naText });
    const arrow = info.cls === 'up' ? '▲' : info.cls === 'down' ? '▼' : info.sign > 0 ? '△' : info.sign < 0 ? '▽' : '–';
    const word = info.cls === 'up' ? '크게 오름' : info.cls === 'down' ? '크게 내림' : '기준 안 변화';
    return el('span', { class: 'delta ' + info.cls, title: word, 'aria-label': `${info.text}, ${word}` }, arrow, ' ', info.text);
  }
  // 전주 대비: 최신 데이터일까지 직전 7일 vs 그 전 7일 (매일 하루씩 밀림)
  //   예) 오늘 11/17 → 최신 데이터일 11/16 → 11/10~11/16 vs 11/3~11/9
  function weekToDate(last) {
    return { a: [addDays(last, -6), last], b: [addDays(last, -13), addDays(last, -7)] };
  }
  const ruleLine = () => el('div', { class: 'rule' },
    el('span', {}, '증감 표시 기준:'),
    chip({ cls: 'up', text: `비율 +${RULE.ratePP}%p↑ / 인원 +${RULE.countPct}%↑`, sign: 1 }),
    chip({ cls: 'down', text: `비율 −${RULE.ratePP}%p↓ / 인원 −${RULE.countPct}%↓`, sign: -1 }),
    chip({ cls: 'flat', text: '그 사이', sign: 0 }));

  // =====================================================================
  // 본문: 보기 탭에 따라 전체가 바뀜
  //   all    = 전체 기간 추이 (기본)
  //   wow    = 직전 7일 vs 그 전 7일
  //   dod    = 최신일 vs 전일
  //   custom = 직접 고른 두 기간
  // 비교 모드에서는 각 차트가 '이번 기간(보라) vs 비교 기간(회색)' 날짜별 나란히 막대로 바뀜
  // =====================================================================
  const swatch = c => { const i = el('i'); i.style.background = c; return i; };
  const M = key => METRICS.find(x => x.key === key);

      const rows = daily.filter(r => r[m.den]);
      lineChart(host, rows.map(r => ({ x: r.date, y: m.day(r), r })), {
        color: 'gray', fmt: (x, axis) => axis ? m.axis(x) : m.fmt(x), tipLabel: m.label,
        extra: p => [[`${nf.format(p.r[m.num])} / ${nf.format(p.r[m.den])}`, '해당 / 전체']],
      });
    });
  }

  function funnel(host, steps) {
    host.replaceChildren();
    const n0 = steps[0].n;
    let wi = 1; for (let i = 2; i < steps.length; i++) if (steps[i].n / steps[i - 1].n < steps[wi].n / steps[wi - 1].n) wi = i;
    steps.forEach((st, i) => {
      if (i) host.append(el('div', { class: 'frow' }, el('span'), el('div', { class: 'conv' },
        '↓ ', el('b', { text: pct(st.n / steps[i - 1].n) }), ' 전환', i === wi ? el('span', { class: 'worst', text: '가장 큰 감소' }) : null)));
      const f = el('div', { class: 'fill' }); f.style.width = (st.n / n0 * 100) + '%';
      const row = el('div', { class: 'frow', tabindex: 0 }, el('div', { class: 'name', text: st.step }), el('div', { class: 'bar' }, f), el('div', { class: 'val', text: nf.format(st.n) }));
      const rows = () => [[nf.format(st.n), st.step, true], [pct(st.n / n0), '앱 실행 대비'], ...(i ? [[pct(st.n / steps[i - 1].n), '전 단계 대비']] : [])];
      row.addEventListener('pointermove', e => showTip(e, rows()));
      row.addEventListener('focus', e => showTip(e, rows()));
      row.addEventListener('pointerleave', hideTip); row.addEventListener('blur', hideTip);
      host.append(row);
    });
  }

  // 보기 탭 (본문 맨 위, 스크롤해도 따라옴)
  function renderViewbar(D) {
    const bar = $('#viewbar');
    const tabs = el('div', { class: 'seg', role: 'tablist', 'aria-label': '본문 보기' });
    const extra = el('div');
    const MODES = [['all', '전체 현황'], ['wow', '전주 대비'], ['dod', '전일 대비'], ['custom', '기간 설정']];
    const sync = () => {
      tabs.querySelectorAll('button').forEach(b => { const on = b.dataset.id === VIEW; b.setAttribute('aria-pressed', String(on)); b.setAttribute('aria-selected', String(on)); });
      extra.replaceChildren();
      const v = viewOf(VIEW);
      if (VIEW === 'custom') extra.append(customInputs(() => { renderBody(D); syncPeriod(); }));
      else extra.append(periodLine);   // 기간 설정 탭은 입력칸에 기간이 보이므로 요약 줄 생략
      syncPeriod();
    };
    const periodLine = el('div', { class: 'period' });
    const syncPeriod = () => {
      const v = viewOf(VIEW);
      periodLine.replaceChildren(...(v
        ? [el('span', {}, swatch('var(--cur)'), el('b', { text: v.labels[0] + ' ' }), rangeText(...v.A)), el('span', { text: 'vs' }),
           el('span', {}, swatch('var(--base)'), el('b', { text: v.labels[1] + ' ' }), rangeText(...v.B))]
        : [el('span', { text: `전체 기간 추이 · 최신 데이터일 ${mdw(LAST)}` })]));
    };
    MODES.forEach(([id, label]) => {
      const b = el('button', { type: 'button', role: 'tab', 'data-id': id, text: label });
      b.addEventListener('click', () => { VIEW = id; sync(); renderBody(D); if (location.hash.slice(1) !== id) history.replaceState(null, '', id === 'all' ? location.pathname : '#' + id); });
      tabs.append(b);
    });
    bar.replaceChildren(tabs, extra);
    const h = location.hash.slice(1); if (MODES.some(m => m[0] === h)) VIEW = h;
    sync();
    window.addEventListener('hashchange', () => {
      const id = location.hash.slice(1) || 'all';
      if (id !== VIEW && MODES.some(m => m[0] === id)) { VIEW = id; sync(); renderBody(D); }
    });
  }

  function renderKpis(D) {
    const K = D.kpi;
    const wk = weekToDate(LAST);
    const when = '전주 대비';
    const wow = key => {
      const m = METRICS.find(x => x.key === key);
      const a = agg(m, ...wk.a), b = agg(m, ...wk.b);
      return el('div', { class: 'wow' }, chip(a && b ? deltaInfo(m, a.v, b.v) : null), el('span', { class: 'when', text: when }));
    };
    const frac = k => `${nf.format(k.numerator)} / ${nf.format(k.denominator)}`;
    const bar = v => { const b = el('div', { class: 'bar' }); const i = el('i'); i.style.width = v + '%'; b.append(i); return b; };
    const kpi = (k, pill, key) => el('div', { class: 'kpi' },
      el('div', { class: 'label' }, k.label, pill ? el('span', { class: 'pill', text: pill }) : null),
      el('div', { class: 'value', text: k.value.toFixed(1) + '%' }), bar(k.value), el('div', { class: 'frac', text: frac(k) }),
      key ? wow(key) : null);
    $('#kpis').replaceChildren(
      el('div', { class: 'kpi hero' },
        el('div', { class: 'label', text: '핵심 · ' + K.launch_to_complete.label }),
        el('div', { class: 'value', text: K.launch_to_complete.value.toFixed(1) + '%' }), bar(K.launch_to_complete.value),
        el('div', { class: 'frac', text: frac(K.launch_to_complete) + ' 사용자×날짜' }),
        wow('l2c')),
      kpi(K.launch_to_start, null, 'l2s'), kpi(K.open_start_10m, null, 'o10'), kpi(K.aha_rate, null, null));
  }

  function render(D) {
    DAILY = D.daily; DAILY.forEach(r => { BYDATE[r.date] = r; });
    FIRST = DAILY[0].date; LAST = DAILY[DAILY.length - 1].date;
    $('#meta').append(
      el('span', { text: `KPI 기간 ${md(D.meta.kpi_period[0])}~${md(D.meta.kpi_period[1])} · A/B 테스트 전 기준값` }),
      el('span', { text: `최신 데이터일 ${mdw(LAST)}` }),
      (() => { const wk = weekToDate(LAST); return el('span', { text: `KPI 전주 대비 = 직전 7일 ${rangeText(...wk.a)} vs 그 전 7일 ${rangeText(...wk.b)}` }); })(),
      el('span', { text: `갱신 ${D.meta.generated_at.replace('T', ' ').slice(0, 16)} KST` }));
    renderKpis(D);
    $('#app').replaceChildren(el('div', { class: 'viewbar', id: 'viewbar' }), el('div', { id: 'body' }));
    renderViewbar(D);
    renderBody(D);
  }

  fetch('data.json', { cache: 'no-store' })
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(render)
    .catch(e => { $('#app').replaceChildren(el('div', { class: 'err', text: `data.json을 불러오지 못했습니다 (${e.message}). 로컬에서는 docs 폴더에서 간단한 웹 서버로 열어야 합니다.` })); console.error(e); });
})();
</script>
</body>
</html>
