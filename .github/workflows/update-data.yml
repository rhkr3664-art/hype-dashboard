# 매일 mart를 다시 만들고 docs/data.json을 갱신해 커밋한다 (GitHub Pages가 docs 폴더를 공개).
# BigQuery 접속은 키 파일 없이 Workload Identity로 한다 (Secret 불필요).
# 처음 한 번 프로젝트 소유자가 bigquery/setup_github_access.sh 를 Cloud Shell에서 실행해야 한다.
name: update-dashboard-data

on:
  schedule:
    - cron: '0 0 * * *'   # 매일 09:00 KST
  workflow_dispatch:       # Actions 탭에서 수동 실행

permissions:
  contents: write
  id-token: write   # Workload Identity 토큰 발급

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r bigquery/requirements.txt

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/528946769718/locations/global/workloadIdentityPools/github/providers/github-repo
          service_account: hype-dashboard-actions@swift-implement-513705-i7.iam.gserviceaccount.com

      - name: mart 갱신
        run: python bigquery/run_mart.py

      - name: 노트북 기준 숫자 검증
        run: python bigquery/validate_mart.py

      - name: data.json 내보내기
        run: python bigquery/export_json.py

      - name: 바뀐 경우에만 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          git diff --cached --quiet || git commit -m "data: dashboard data.json 갱신"
          git push
