# 매일 mart를 다시 만들고 dashboard/data.json을 갱신해 커밋한다.
# 필요한 저장소 Secret: GCP_SA_KEY (BigQuery 서비스 계정 JSON 키 전체)
# 서비스 계정 권한: BigQuery 데이터 편집자(mart), BigQuery 작업 사용자, clean 데이터셋 읽기
name: update-dashboard-data

on:
  schedule:
    - cron: '0 0 * * *'   # 매일 09:00 KST
  workflow_dispatch:       # Actions 탭에서 수동 실행

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r bigquery/requirements.txt

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: mart 갱신
        run: python bigquery/run_mart.py

      - name: 노트북 기준 숫자 검증
        run: python bigquery/validate_mart.py

      - name: data.json 내보내기
        run: python bigquery/export_json.py

      - name: 바뀐 경우에만 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/data.json
          git diff --cached --quiet || git commit -m "data: dashboard data.json 갱신"
          git push
